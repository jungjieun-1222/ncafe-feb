# === Production Profile ===
# docker-compose에서 SPRING_PROFILES_ACTIVE=prod 로 활성화됨

# JPA: 운영 환경에서도 테이블 자동 생성 (update) 하도록 설정하여 초기 기동 문제 방지
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT 시크릿 (환경변수로 주입, 미설정 시 기동 실패)
jwt.secret=${JWT_SECRET}

# DB 비밀번호 (환경변수로 주입)
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# SQL 초기화 강제 (데이터 안 나오는 문제 해결)
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.continue-on-error=true

# 파일 업로드 및 정적 리소스 설정 (Docker 환경의 /app/upload 참조)
upload.path=/app/upload/
spring.mvc.static-path-pattern=/**
spring.web.resources.static-locations=file:${upload.path},classpath:/static/