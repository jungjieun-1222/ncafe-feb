services:
  backend:
    image: ${BACKEND_IMAGE:-mochijj-backend:latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${USER_ID:-mochijj}-backend
    # ports:
    #   - "${BACKEND_PORT:-8012}:8081"
    expose:
      - "8081"
    volumes:
      - ${UPLOAD_PATH:-../ncafe-upload}:/app/upload
      - ./frontend/public/images:/app/extra-static/images:ro
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - UPLOAD_PATH=/app/upload/
      - SPRING_WEB_RESOURCES_STATIC_LOCATIONS=file:/app/upload/,file:/app/extra-static/,classpath:/static/
    restart: unless-stopped
    depends_on:
      - db
    networks:
      - ncafe-network

  frontend:
    image: ${FRONTEND_IMAGE:-ncafe-frontend:latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ${USER_ID:-mochijj}-frontend
    ports:
      - "${FRONTEND_PORT:-3012}:3000"
    environment:
      - API_BASE_URL=http://backend:8081
      - BACKEND_URL=http://backend:8081
      - AGENT_URL=http://agent-server:8000
      - SESSION_SECRET=${SESSION_SECRET}
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - ncafe-network

  agent-server:
    image: ${AGENT_SERVER_IMAGE:-agent-server:latest}
    build:
      context: ./agent-server
      dockerfile: Dockerfile
    container_name: ${USER_ID:-mochijj}-agent-server
    profiles: ["with-db"]
    # ports:
    #   - "${AGENT_SERVER_PORT:-8112}:8000"
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - BACKEND_URL=http://backend:8081
    depends_on:
      - db
      - backend
    restart: unless-stopped
    networks:
      - ncafe-network

  db:
    image: pgvector/pgvector:pg17
    profiles: ["with-db", "agent"]
    container_name: ${USER_ID:-mochijj}-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ncafedb}
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-ncafe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # ports:
    #   - "${DB_PORT:-5412}:5432"
    expose:
      - "5432"
    volumes:
      - ${DB_DATA_PATH:-../ncafe-data}:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - ncafe-network



#volumes:
#  ncafe-db-data:
#  ncafe-upload:

networks:
  ncafe-network:
    name: ${USER_ID:-mochijj}_ncafe_default
    driver: bridge