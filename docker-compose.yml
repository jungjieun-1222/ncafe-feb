services:
  backend:
    image: ${BACKEND_IMAGE:-ncafe-backend:latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${USER_ID:-mochijj}-backend
    ports:
      - "${BACKEND_PORT:-8012}:8081"
    volumes:
      - ./upload:/app/upload
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    restart: unless-stopped
    depends_on:
      - db
    networks:
      - ncafe-network

  frontend:
    image: ${FRONTEND_IMAGE:-ncafe-frontend:latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ${USER_ID:-mochijj}-frontend
    ports:
      - "${FRONTEND_PORT:-3012}:3001"
    environment:
      - API_BASE_URL=http://backend:8081
      - SESSION_SECRET=${SESSION_SECRET}
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - ncafe-network

  db:
    image: postgres:17
    profiles: [ "with-db" ]
    container_name: ${USER_ID:-mochijj}-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ncafedb}
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-ncafe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_PORT:-5412}:5432"
    volumes:
      - ncafe-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - ncafe-network

volumes:
  ncafe-db-data:

networks:
  ncafe-network:
    driver: bridge