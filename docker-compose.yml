services:
  backend:
    image: ${BACKEND_IMAGE:-mochijj-backend:latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${USER_ID:-mochijj}-backend
    # ports:
    #   - "${BACKEND_PORT:-8012}:8081"
    volumes:
      - ncafe-upload:/app/upload
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_HOST=redis
    restart: unless-stopped
    depends_on:
      - db
      - redis
    networks:
      - ncafe-network

  frontend:
    image: ${FRONTEND_IMAGE:-ncafe-frontend:latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ${USER_ID:-mochijj}-frontend
    ports:
      - "${FRONTEND_PORT:-3012}:3000"
    environment:
      - API_BASE_URL=http://backend:8081
      - SESSION_SECRET=${SESSION_SECRET}
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - ncafe-network

  agent-server:
    image: ${AGENT_SERVER_IMAGE:-agent-server:latest}
    build:
      context: ./agent-server
      dockerfile: Dockerfile
    container_name: ${USER_ID:-mochijj}-agent-server
    ports:
      - "${AGENT_SERVER_PORT:-8112}:8000"
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BACKEND_URL=http://backend:8081
    depends_on:
      - backend
      - redis
    restart: unless-stopped
    networks:
      - ncafe-network

  db:
    image: pgvector/pgvector:pg17
    profiles: [ "with-db" ]
    container_name: ${USER_ID:-mochijj}-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ncafedb}
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-ncafe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # ports:
    #   - "${DB_PORT:-5412}:5432"
    volumes:
      - ncafe-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - ncafe-network

  redis:
    image: redis:7-alpine
    container_name: ${USER_ID:-mochijj}-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    restart: unless-stopped
    networks:
      - ncafe-network

volumes:
  ncafe-db-data:
  ncafe-upload:

networks:
  ncafe-network:
    name: ${USER_ID:-mochijj}_ncafe_default
    driver: bridge