name: Deploy

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pre-cleanup and Fix permissions
        run: |
          echo "Force-cleaning potentially locked directories using Docker..."
          # docker-compose down first to release locks
          docker compose down || true
          
          # Use a temporary alpine container to delete directories that often have root ownership (from Postgres/Docker)
          # This avoids 'permission denied' errors during the checkout step
          docker run --rm -v $(pwd):/workspace -w /workspace alpine sh -c "rm -rf data backend/upload 2>/dev/null" || true
          
          # Also try to fix ownership of the rest of the workspace
          sudo chown -R $(whoami):$(whoami) . || true
          # Ensure directories are clean
          sudo rm -rf data backend/upload || true
          ls -la

      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Create .env file
        run: |
          echo "COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME}" > .env
          echo "USER_ID=${USER_ID}" >> .env
          echo "BACKEND_PORT=${BACKEND_PORT}" >> .env
          echo "FRONTEND_PORT=${FRONTEND_PORT}" >> .env
          echo "DB_PORT=${DB_PORT}" >> .env
          echo "API_BASE_URL=http://mochijj-backend:8081" >> .env
          echo "DATABASE_NAME=${POSTGRES_DB:-ncafedb}" >> .env
          echo "SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${POSTGRES_DB:-ncafedb}" >> .env
          echo "SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}" >> .env
          echo "SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}" >> .env
          echo "JWT_SECRET=${JWT_SECRET}" >> .env
          echo "SESSION_SECRET=${SESSION_SECRET}" >> .env
          echo "POSTGRES_DB=${POSTGRES_DB}" >> .env
          echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}" >> .env
          echo "COMPOSE_PROFILES=with-db" >> .env
          echo "AGENT_SERVER_PORT=${AGENT_SERVER_PORT}" >> .env
          echo "AGENT_SERVER_IMAGE=${AGENT_SERVER_IMAGE}" >> .env
          echo "REDIS_HOST=redis" >> .env
          echo "REDIS_PORT=6379" >> .env
        env:
          COMPOSE_PROJECT_NAME: ${{ vars.COMPOSE_PROJECT_NAME }}
          USER_ID: ${{ vars.USER_ID }}
          BACKEND_PORT: ${{ vars.BACKEND_PORT }}
          FRONTEND_PORT: ${{ vars.FRONTEND_PORT }}
          DB_PORT: ${{ vars.DB_PORT }}
          SPRING_DATASOURCE_URL: ${{ vars.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ vars.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          AGENT_SERVER_PORT: ${{ vars.AGENT_SERVER_PORT }}
          AGENT_SERVER_IMAGE: ${{ vars.AGENT_SERVER_IMAGE }}
          REDIS_HOST: ${{ vars.REDIS_HOST }}
          REDIS_PORT: ${{ vars.REDIS_PORT }}

      - name: Deploy with Docker Compose
        run: |
          docker compose down || true
          docker compose up -d --build

      - name: Verify deployment
        run: |
          echo "=== Waiting for containers to stabilize (30s) ==="
          sleep 30
          echo ""
          echo "=== Container Status ==="
          docker compose ps
          echo ""
          echo "=== Environment Check (Sanitized) ==="
          grep -v "PASSWORD\|SECRET" .env || true
          echo ""
          echo "=== Backend Logs ==="
          docker compose logs backend --tail 20
          echo ""
          echo "=== Database Logs ==="
          docker compose logs db --tail 10
          echo ""
          echo "=== Health Check ==="
          curl -sf --max-time 10 -o /dev/null -w "Frontend : HTTP %{http_code}\n" http://localhost:${FRONTEND_PORT:-3012} || echo "Frontend : not responding"
        env:
          FRONTEND_PORT: ${{ vars.FRONTEND_PORT }}

      - name: Clean up old images
        run: docker image prune -f
      
      - name: Post-cleanup Fix permissions
        if: always()
        run: |
          echo "Restoring workspace ownership..."
          sudo chown -R $(whoami):$(whoami) . || true
