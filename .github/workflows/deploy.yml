name: Deploy

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Fix workspace permissions
        run: |
          cd "$GITHUB_WORKSPACE" || true
          docker compose down 2>/dev/null || true
          sudo rm -rf data upload 2>/dev/null || true
          sudo chown -R $(whoami) "$GITHUB_WORKSPACE" 2>/dev/null || true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME}" > .env
          echo "USER_ID=${USER_ID}" >> .env
          echo "BACKEND_PORT=${BACKEND_PORT}" >> .env
          echo "FRONTEND_PORT=${FRONTEND_PORT}" >> .env
          echo "DB_PORT=${DB_PORT}" >> .env
          echo "API_BASE_URL=http://backend:8081" >> .env
          echo "SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}" >> .env
          echo "SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}" >> .env
          echo "SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}" >> .env
          echo "JWT_SECRET=${JWT_SECRET}" >> .env
          echo "SESSION_SECRET=${SESSION_SECRET}" >> .env
          echo "POSTGRES_DB=${POSTGRES_DB}" >> .env
          echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}" >> .env
          echo "COMPOSE_PROFILES=with-db" >> .env
        env:
          COMPOSE_PROJECT_NAME: ${{ vars.COMPOSE_PROJECT_NAME }}
          USER_ID: ${{ vars.USER_ID }}
          BACKEND_PORT: ${{ vars.BACKEND_PORT }}
          FRONTEND_PORT: ${{ vars.FRONTEND_PORT }}
          DB_PORT: ${{ vars.DB_PORT }}
          SPRING_DATASOURCE_URL: ${{ vars.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ vars.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

      - name: Build and Deploy
        run: docker compose up --build -d

      - name: Verify deployment
        run: |
          echo "=== Container Status ==="
          docker compose ps
          echo ""
          echo "=== Backend Logs ==="
          docker compose logs backend | tail -n 20
          sleep 15
          echo ""
          echo "=== Health Check ==="
          curl -sf --max-time 10 -o /dev/null -w "Frontend : HTTP %{http_code}\n" http://localhost:${FRONTEND_PORT:-3012} || echo "Frontend : not responding"
        env:
          FRONTEND_PORT: ${{ vars.FRONTEND_PORT }}

      - name: Clean up old images
        run: docker image prune -f
