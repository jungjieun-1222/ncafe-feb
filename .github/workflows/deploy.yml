name: Deploy

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Force Fix Permissions
        run: |
          # Checkout 전에 미리 공간을 확보하고 권한을 가져옵니다.
          sudo chown -R $(whoami):$(whoami) . || true
          docker compose down || true
          # 특히 문제가 되는 data 폴더를 sudo로 미리 밀어버립니다.
          sudo rm -rf data 2>/dev/null || true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME}" > .env
          echo "USER_ID=${USER_ID}" >> .env
          echo "BACKEND_PORT=${BACKEND_PORT}" >> .env
          echo "FRONTEND_PORT=${FRONTEND_PORT}" >> .env
          echo "DB_PORT=${DB_PORT}" >> .env
          echo "API_BASE_URL=http://mochijj-backend:8081" >> .env
          echo "DATABASE_NAME=${POSTGRES_DB:-ncafedb}" >> .env
          echo "SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${POSTGRES_DB:-ncafedb}" >> .env
          echo "SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}" >> .env
          echo "SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}" >> .env
          echo "JWT_SECRET=${JWT_SECRET}" >> .env
          echo "SESSION_SECRET=${SESSION_SECRET}" >> .env
          echo "POSTGRES_DB=${POSTGRES_DB}" >> .env
          echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}" >> .env
          echo "COMPOSE_PROFILES=with-db" >> .env
        env:
          COMPOSE_PROJECT_NAME: ${{ vars.COMPOSE_PROJECT_NAME }}
          USER_ID: ${{ vars.USER_ID }}
          BACKEND_PORT: ${{ vars.BACKEND_PORT }}
          FRONTEND_PORT: ${{ vars.FRONTEND_PORT }}
          DB_PORT: ${{ vars.DB_PORT }}
          SPRING_DATASOURCE_URL: ${{ vars.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ vars.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

      - name: Deploy with Docker Compose
        run: |
          docker compose down || true
          docker compose up -d --build

      - name: Verify deployment
        run: |
          echo "=== Waiting for containers to stabilize (30s) ==="
          sleep 30
          echo ""
          echo "=== Container Status ==="
          docker compose ps
          echo ""
          echo "=== Environment Check (Sanitized) ==="
          grep -v "PASSWORD\|SECRET" .env || true
          echo ""
          echo "=== Backend Logs ==="
          docker compose logs backend --tail 20
          echo ""
          echo "=== Database Logs ==="
          docker compose logs db --tail 10
          echo ""
          echo "=== Health Check ==="
          curl -sf --max-time 10 -o /dev/null -w "Frontend : HTTP %{http_code}\n" http://localhost:${FRONTEND_PORT:-3012} || echo "Frontend : not responding"
        env:
          FRONTEND_PORT: ${{ vars.FRONTEND_PORT }}

      - name: Clean up old images
        run: docker image prune -f
      
      - name: Post-cleanup Fix permissions
        if: always()
        run: |
          echo "Restoring workspace ownership..."
          sudo chown -R $(whoami):$(whoami) .
